name: CI

# Seven jobs, all cheap and dependency-free (jq is preinstalled on the
# runner): the manifests and the marketplace catalog must be well-formed, any
# change to a plugin must come with a version bump for that plugin
# (scripts/version-bump.sh, which scripts/test-version-bump.sh first runs on a
# planted repository; both jobs read a version through
# scripts/plugin-version.sh), every
# innovation-platform skill's Version gate block must stay byte-identical to
# the rest, the plugin (and the platform record vendored beside it) must name
# no one platform instance (scripts/instance-neutral.sh), every MCP tool it
# names must be one the platform serves, and it must name every one the
# platform serves (scripts/check-tool-names.sh, against the pinned
# scripts/platform-tools.txt, which needs no platform checkout), no file in it
# may hold an em or en dash (scripts/check-dashes.sh, which
# scripts/test-check-dashes.sh first runs on trees it plants), and it must
# agree with the pinned platform release: the tool list is the pinned
# record's, every contract section a skill asks for is one the record's
# contract has (scripts/check-contract-sections.sh), and the plugin's version
# is at least the record's app plugin floor (scripts/check-plugin-floor.sh),
# each check first proved on its fixture. The record,
# scripts/platform-compat.json, is the platform's docs/compat.json at a
# release, vendored by scripts/platform-compat.sh because the platform
# repository is private; CI reads only the vendored copy.
#
# Why the bump is a HARD gate rather than a convention: delivery is keyed on
# the declared version. Claude Code caches an installed plugin at
# ~/.claude/plugins/cache/<marketplace>/<plugin>/<version>/ and records that
# version in installed_plugins.json, so shipping edited content under a
# version a user already has can leave them on the old build with no signal
# that anything changed. Every edit under plugins/<name>/ ships to users —
# skills, README, .mcp.json alike — so every edit needs a new version, down to
# a typo fix (a user still has to RECEIVE the typo fix).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Every plugin.json is well-formed and semver-versioned
        run: |
          set -euo pipefail
          fail=0
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            plugin="$(basename "$(dirname "$(dirname "$manifest")")")"
            if ! jq empty "$manifest" 2>/dev/null; then
              echo "::error file=$manifest::not valid JSON"
              fail=1; continue
            fi
            for field in name version description; do
              if [ "$(jq -r --arg f "$field" 'has($f)' "$manifest")" != "true" ]; then
                echo "::error file=$manifest::missing required field \"$field\""
                fail=1
              fi
            done
            name="$(jq -r '.name // ""' "$manifest")"
            if [ "$name" != "$plugin" ]; then
              echo "::error file=$manifest::name \"$name\" does not match its directory \"$plugin\""
              fail=1
            fi
            # MAJOR.MINOR.PATCH only. The Innovation Platform compares this
            # value server-side (compareSemver in inno-platform's src/util.ts),
            # and it returns "unparseable" for anything else — a pre-release or
            # v-prefixed version here would read to the platform as a plugin
            # that failed to report its version at all. Read through
            # scripts/plugin-version.sh, as the version-bump gate reads it,
            # and named in the error as JSON, so whitespace in it shows.
            if ! bash scripts/plugin-version.sh "$manifest" >/dev/null; then
              echo "::error file=$manifest::version $(jq -c '.version' "$manifest") is not a plain MAJOR.MINOR.PATCH triple"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "All plugin manifests OK."

      - name: The marketplace catalog is well-formed
        run: |
          set -euo pipefail
          if ! jq empty .claude-plugin/marketplace.json; then
            echo "::error file=.claude-plugin/marketplace.json::not valid JSON"
            exit 1
          fi
          echo "Marketplace catalog OK."

  version-bump:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base commit to diff against

      # The gate first proves itself on a repository it plants: a good change
      # passes, and each planted unreadable version, and each version that did
      # not go up, fails, with exactly the gate's output for each.
      - name: The version gate catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-version-bump.sh

      # Fails closed on a base it cannot read; scripts/version-bump.sh says
      # how, and which skips it allows.
      - name: A touched plugin must declare a new version
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          bash scripts/version-bump.sh

  version-gate-parity:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Every innovation-platform skill's Version gate block matches
        run: |
          set -euo pipefail
          fail=0
          first=""
          first_file=""
          count=0
          for f in plugins/innovation-platform/skills/*/SKILL.md; do
            count=$((count + 1))
            block="$(awk '/^## Version gate/{p=1} p{print} p&&/^Carry on\.$/{exit}' "$f")"
            if [ -z "$block" ]; then
              echo "::error file=$f::no \"## Version gate\" block found (expected one starting at that heading and ending at a bare \"Carry on.\" line)"
              fail=1
              continue
            fi
            sum="$(printf '%s' "$block" | md5sum | cut -d' ' -f1)"
            if [ -z "$first" ]; then
              first="$sum"
              first_file="$f"
              continue
            fi
            if [ "$sum" != "$first" ]; then
              echo "::error file=$f::Version gate block differs from $first_file, keep it byte-identical across every skill"
              fail=1
            fi
          done
          echo "Compared the Version gate block across $count skill files."
          [ "$fail" -eq 0 ] || exit 1

  instance-neutral:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: The innovation-platform plugin names no instance
        run: |
          set -euo pipefail
          bash scripts/instance-neutral.sh plugins/innovation-platform

      # The vendored platform record and the tool list made from it are
      # public too. They are scanned in a directory of their own, because
      # scripts/ also holds instance-neutral.sh, whose patterns match
      # themselves.
      - name: The vendored platform record names no instance
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cp scripts/platform-compat.json scripts/platform-tools.txt "$dir/"
          bash scripts/instance-neutral.sh "$dir"

  tool-names:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The check first proves itself on its fixture: it must report exactly
      # the names the fixture plants, and nothing the fixture marks as passing.
      - name: The tool-name check catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-check-tool-names.sh

      # Against scripts/platform-tools.txt, the pinned copy of the platform's
      # tool names, which scripts/platform-compat.sh writes from the pinned
      # record at each resync; the check's header says what it checks.
      - name: The innovation-platform plugin names only tools the platform serves, and all of them
        run: |
          set -euo pipefail
          bash scripts/check-tool-names.sh plugins/innovation-platform

  no-dashes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The check first proves itself on trees it plants: a clean tree with
      # look-alikes passes, and each planted em or en dash, built from its
      # bytes, is reported by file:line with nothing else.
      - name: The dash check catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-check-dashes.sh

      - name: The innovation-platform plugin holds no em or en dash
        run: |
          set -euo pipefail
          bash scripts/check-dashes.sh plugins/innovation-platform

  platform-compat:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # scripts/platform-compat.json is the platform's compatibility record at
      # the pinned release, and scripts/platform-tools.txt is written from it
      # by the same run of scripts/platform-compat.sh, so the two must agree:
      # the list names the pinned commit and holds exactly the record's tools.
      - name: The pinned tool list is the pinned record's
        run: |
          set -euo pipefail
          record=scripts/platform-compat.json
          list=scripts/platform-tools.txt
          if ! jq -e '.format == 1 and (.pinned.commit | type == "string" and test("^[0-9a-f]{40}$"))' "$record" >/dev/null; then
            echo "::error file=$record::not a format 1 record with a pinned commit; regenerate it with scripts/platform-compat.sh"
            exit 1
          fi
          commit="$(jq -r '.pinned.commit' "$record")"
          if ! grep -qF "(commit $commit)" "$list"; then
            echo "::error file=$list::its header does not name the pinned commit $commit; regenerate both files with scripts/platform-compat.sh"
            exit 1
          fi
          if ! diff <(grep -v '^#' "$list") <(jq -r '.tools.list[].name' "$record" | LC_ALL=C sort); then
            echo "::error file=$list::its names differ from tools.list in $record (diff above); regenerate both files with scripts/platform-compat.sh"
            exit 1
          fi
          echo "The $(grep -vc '^#' "$list") pinned tool names are the pinned record's, at $(jq -r '.pinned.ref' "$record")."

      # The check first proves itself on its fixture: it must report exactly
      # the lines the fixture plants, and pass the look-alikes.
      - name: The contract-sections check catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-check-contract-sections.sh

      - name: The innovation-platform plugin asks only for sections the pinned contract has
        run: |
          set -euo pipefail
          bash scripts/check-contract-sections.sh plugins/innovation-platform

      # The floor check first proves it compares versions as numbers (2.10.0
      # is above 2.9.0) on records and manifests it plants.
      - name: The floor check catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-check-plugin-floor.sh

      - name: The innovation-platform plugin is at least the pinned release's app plugin floor
        run: |
          set -euo pipefail
          bash scripts/check-plugin-floor.sh
