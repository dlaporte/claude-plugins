name: CI

# Eight jobs, every step's run block set -euo pipefail and one
# `bash scripts/...` line run from the repository root, so a local run is
# those same lines (CLAUDE.md, "The checks"). Each script's header says what
# it checks, and a check's test-*.sh twin runs first and proves it on cases it
# plants. Why every change to a plugin needs a new version, and how the
# platform release the plugin is checked against is pinned: CLAUDE.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # scripts/lib.sh holds what the checks share and scripts/test-lib.sh
      # the tests' harness; run, test-lib.sh proves both.
      - name: The shared helpers and the test harness do what their fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-lib.sh

      - name: The manifests check catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-check-manifests.sh

      # The catalog's description is the one users read at install, the
      # README's the one they read first, and plugin.json's the one the
      # plugin carries: one text, compared whole, so none drifts from the
      # others unseen (two did once, after a sync).
      - name: Every plugin.json and the marketplace catalog are well-formed, and each plugin's description is one text
        run: |
          set -euo pipefail
          bash scripts/check-manifests.sh

  version-bump:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need the base commit to diff against

      # The gate first proves itself on a repository it plants: a good change
      # passes, and each planted unreadable version, and each version that did
      # not go up, fails, with exactly the gate's output for each.
      - name: The version gate catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-version-bump.sh

      # Fails closed on a base it cannot read; scripts/version-bump.sh says
      # how, and which skips it allows.
      - name: A touched plugin must declare a new version
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          bash scripts/version-bump.sh

  version-gate-parity:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The Version gate check catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-check-version-gate.sh

      - name: The Version gate renderer writes what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-render-gates.sh

      # scripts/version-gate.md is the gate's one source, which
      # scripts/render-gates.sh writes into every skill; --check runs
      # scripts/check-version-gate.sh, which also refuses a block with no
      # heading, no "Carry on." line or two of either.
      - name: Every innovation-platform skill holds the Version gate from scripts/version-gate.md, once
        run: |
          set -euo pipefail
          bash scripts/render-gates.sh --check

  instance-neutral:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The instance check catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-instance-neutral.sh

      - name: The innovation-platform plugin names no instance
        run: |
          set -euo pipefail
          bash scripts/instance-neutral.sh plugins/innovation-platform

      # The vendored platform record and the tool list made from it are
      # public too. Named one by one, since scripts/ also holds
      # instance-neutral.sh, whose patterns match themselves.
      - name: The vendored platform record names no instance
        run: |
          set -euo pipefail
          bash scripts/instance-neutral.sh scripts/platform-compat.json scripts/platform-tools.txt

  tool-names:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The check first proves itself on its fixture: it must report exactly
      # the names the fixture plants, and nothing the fixture marks as passing.
      - name: The tool-name check catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-check-tool-names.sh

      # Against scripts/platform-tools.txt, the pinned copy of the platform's
      # tool names, which scripts/platform-compat.sh writes from the pinned
      # record at each resync; the check's header says what it checks.
      - name: The innovation-platform plugin names only tools the platform serves, and all of them
        run: |
          set -euo pipefail
          bash scripts/check-tool-names.sh plugins/innovation-platform

      # Against scripts/snow-tools.txt, snow-mcp's tool names pinned at a
      # release (its header says how it was written).
      - name: The servicenow plugin names only tools snow-mcp serves, and all of them
        run: |
          set -euo pipefail
          bash scripts/check-tool-names.sh --pinned scripts/snow-tools.txt plugins/servicenow

  no-dashes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The check first proves itself on trees it plants: a clean tree with
      # look-alikes passes, and each planted em or en dash, built from its
      # bytes, is reported by file:line with nothing else.
      - name: The dash check catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-check-dashes.sh

      # With no path the check reads both plugins and the repository's other
      # public text: README.md, CLAUDE.md, the marketplace catalog, .github
      # and scripts.
      - name: The plugins and the repository's public text hold no em or en dash
        run: |
          set -euo pipefail
          bash scripts/check-dashes.sh

  platform-compat:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # scripts/platform-compat.json is the platform's compatibility record at
      # the pinned release, and scripts/platform-tools.txt is written from it
      # by the same run of scripts/platform-compat.sh, so the two must agree:
      # the list's header names the pinned ref and commit, and it holds
      # exactly the record's tools. The pinned ref must be a release tag (a
      # preview is never committed). The check first proves itself on files
      # it plants, the passing pair written by platform-compat.sh itself.
      - name: The tool-list check catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-check-platform-tools.sh

      - name: The pinned tool list is the pinned record's
        run: |
          set -euo pipefail
          bash scripts/check-platform-tools.sh

      # The check first proves itself on its fixture: it must report exactly
      # the lines the fixture plants, and pass the look-alikes.
      - name: The contract-sections check catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-check-contract-sections.sh

      - name: The innovation-platform plugin asks only for sections the pinned contract has
        run: |
          set -euo pipefail
          bash scripts/check-contract-sections.sh plugins/innovation-platform

      # The starter's build tool pins (esbuild, wrangler, the Tailwind CLI)
      # are the pinned release's behavior.buildTools. The check first proves
      # itself on records and starters it plants.
      - name: The build-tools check catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-check-build-tools.sh

      - name: The starter's build tools are the pinned release's
        run: |
          set -euo pipefail
          bash scripts/check-build-tools.sh

      # The floor check first proves it compares versions as numbers (2.10.0
      # is above 2.9.0) on records and manifests it plants.
      - name: The floor check catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-check-plugin-floor.sh

      - name: The innovation-platform plugin is at least the pinned release's app plugin floor
        run: |
          set -euo pipefail
          bash scripts/check-plugin-floor.sh

      # At a resync, scripts/platform-compat.sh prints what moved since the
      # previous pin, the resync's to-do list, and nothing in CI reads it. Its
      # test pins records from a repository it plants, at release tags only,
      # and previews one at a commit, leaving the pin alone.
      - name: The resync's moved list reports what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-platform-compat.sh

  starter:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      # miniflare otherwise fetches workers.cloudflare.com/cf.json on every run.
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
    steps:
      # The only job that runs code from the npm registry, so the checkout
      # keeps no token in the repository's git config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The node the platform's CI builds an app with.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # A copy of the starter, installed from scripts/starter-test/package-lock.json
      # (npm ci, install scripts off): its interface built with its own
      # dev/build-ui.mjs, the Worker and the interface type-checked, then the
      # storage route on workerd with a local D1 through the starter's own
      # wrangler, its local proxy, dev/serve.mjs, and the built interface in a
      # DOM (jsdom, which the script adds beside typescript at run time, never
      # to the starter's package.json). No credential, and no network beyond
      # the npm registry. The script's header says what moves the lock and how
      # to write a new one.
      - name: The inno-convert-artifact starter builds, type-checks and passes its runtime suite
        run: |
          set -euo pipefail
          bash scripts/test-starter.sh
