name: CI

# Five jobs, all cheap and dependency-free (jq is preinstalled on the
# runner): the manifests and the marketplace catalog must be well-formed, any
# change to a plugin must come with a version bump for that plugin, every
# innovation-platform skill's Version gate block must stay byte-identical to
# the rest, the plugin must name no one platform instance
# (scripts/instance-neutral.sh), and every MCP tool it names must be one the
# platform serves, and it must name every one the platform serves
# (scripts/check-tool-names.sh, against the pinned scripts/platform-tools.txt,
# which needs no platform checkout).
#
# Why the bump is a HARD gate rather than a convention: delivery is keyed on
# the declared version. Claude Code caches an installed plugin at
# ~/.claude/plugins/cache/<marketplace>/<plugin>/<version>/ and records that
# version in installed_plugins.json, so shipping edited content under a
# version a user already has can leave them on the old build with no signal
# that anything changed. Every edit under plugins/<name>/ ships to users —
# skills, README, .mcp.json alike — so every edit needs a new version, down to
# a typo fix (a user still has to RECEIVE the typo fix).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Every plugin.json is well-formed and semver-versioned
        run: |
          set -euo pipefail
          fail=0
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            plugin="$(basename "$(dirname "$(dirname "$manifest")")")"
            if ! jq empty "$manifest" 2>/dev/null; then
              echo "::error file=$manifest::not valid JSON"
              fail=1; continue
            fi
            for field in name version description; do
              if [ "$(jq -r --arg f "$field" 'has($f)' "$manifest")" != "true" ]; then
                echo "::error file=$manifest::missing required field \"$field\""
                fail=1
              fi
            done
            name="$(jq -r '.name // ""' "$manifest")"
            if [ "$name" != "$plugin" ]; then
              echo "::error file=$manifest::name \"$name\" does not match its directory \"$plugin\""
              fail=1
            fi
            # MAJOR.MINOR.PATCH only. The Innovation Platform compares this
            # value server-side (compareSemver in inno-platform's src/util.ts),
            # and it returns "unparseable" for anything else — a pre-release or
            # v-prefixed version here would read to the platform as a plugin
            # that failed to report its version at all.
            version="$(jq -r '.version // ""' "$manifest")"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error file=$manifest::version \"$version\" is not a plain MAJOR.MINOR.PATCH triple"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "All plugin manifests OK."

      - name: The marketplace catalog is well-formed
        run: |
          set -euo pipefail
          if ! jq empty .claude-plugin/marketplace.json; then
            echo "::error file=.claude-plugin/marketplace.json::not valid JSON"
            exit 1
          fi
          echo "Marketplace catalog OK."

  version-bump:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base commit to diff against

      # Fails closed, by the policy of the platform's admin-plugin gate
      # (inno-platform's scripts/admin-plugin-version-bump.mjs and the CI step
      # that runs it): this step exists to fail, so a base it cannot read is
      # not a pass. A base the checkout lacks is fetched, retried once. The
      # only skips are a first push (no base at all) and a forced push whose
      # old tip is gone from the remote (nothing left to compare). Any other
      # failure, a network error, a bad SHA or a git diff error, stops the job
      # with a message.
      - name: A touched plugin must declare a new version
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          # A first push to a branch (or an initial commit) reports an all-zero
          # "before" SHA with nothing to diff against — nothing to enforce.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against — skipping."
            exit 0
          fi
          if ! [[ "$base" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "::error::the base \"$base\" is not a commit SHA, so the version check did not run"
            exit 1
          fi
          if ! git rev-parse --verify --quiet --end-of-options "$base^{commit}" >/dev/null; then
            if ! git fetch --no-tags --depth=50 origin "$base" && ! git fetch --no-tags --depth=50 origin "$base"; then
              # The remote listing is captured before it is searched, so a
              # failed ls-remote cannot read as "the base is not listed".
              if [ "${FORCED:-}" = "true" ] && refs="$(git ls-remote origin)" && ! grep -q "^$base" <<<"$refs"; then
                echo "Forced push: the old tip $base is gone from the remote, skipping."
                exit 0
              fi
              echo "::error::could not fetch the base commit $base, so the version check did not run"
              exit 1
            fi
            if ! git rev-parse --verify --quiet --end-of-options "$base^{commit}" >/dev/null; then
              echo "::error::the base $base is not a commit in this checkout, so the version check did not run"
              exit 1
            fi
          fi

          # Splits a MAJOR.MINOR.PATCH string into three numeric fields and
          # compares them component by component, so 1.10.0 correctly beats
          # 1.9.0 (a plain string compare would get that backwards). A
          # differently-shaped string, or a non-numeric field, fails the
          # comparison the same as a real regression would.
          version_gt() {
            local newv="$1" oldv="$2"
            local n1 n2 n3 o1 o2 o3 extra
            IFS=. read -r n1 n2 n3 extra <<<"$newv"
            [ -z "${extra:-}" ] || return 1
            IFS=. read -r o1 o2 o3 extra <<<"$oldv"
            [ -z "${extra:-}" ] || return 1
            for f in "$n1" "$n2" "$n3" "$o1" "$o2" "$o3"; do
              case "$f" in ''|*[!0-9]*) return 1 ;; esac
            done
            if [ "$n1" -ne "$o1" ]; then [ "$n1" -gt "$o1" ]; return; fi
            if [ "$n2" -ne "$o2" ]; then [ "$n2" -gt "$o2" ]; return; fi
            [ "$n3" -gt "$o3" ]
          }

          fail=0
          for dir in plugins/*/; do
            plugin="$(basename "$dir")"
            if ! changed="$(git diff --name-only "$base" HEAD -- "$dir")"; then
              echo "::error::git diff against the base $base failed for $plugin, so its version was not checked"
              exit 1
            fi
            [ -n "$changed" ] || continue

            manifest="$dir.claude-plugin/plugin.json"
            new="$(jq -r '.version // ""' "$manifest" 2>/dev/null || echo "")"

            if ! git cat-file -e "$base:$manifest" 2>/dev/null; then
              # Genuinely absent at the base: a new plugin, or one newly
              # versioned for the first time. That absence is itself the
              # bump, so there is nothing to compare against.
              echo "OK: $plugin (unversioned) -> $new"
              continue
            fi

            old="$(git show "$base:$manifest" 2>/dev/null | jq -r '.version // ""' 2>/dev/null || echo "")"
            if [ -z "$old" ]; then
              echo "::error file=$manifest::\"$plugin\"'s manifest exists at the base commit ($base) but its version could not be read from it"
              fail=1
              continue
            fi

            if version_gt "$new" "$old"; then
              echo "OK: $plugin $old -> $new"
            else
              echo "::error file=$manifest::\"$plugin\" changed but its version is still $new — bump it. Delivery is keyed on this value, so users already on $new may never receive these changes."
              echo "  changed files:"
              printf '    %s\n' $changed
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

  version-gate-parity:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Every innovation-platform skill's Version gate block matches
        run: |
          set -euo pipefail
          fail=0
          first=""
          first_file=""
          count=0
          for f in plugins/innovation-platform/skills/*/SKILL.md; do
            count=$((count + 1))
            block="$(awk '/^## Version gate/{p=1} p{print} p&&/^Carry on\.$/{exit}' "$f")"
            if [ -z "$block" ]; then
              echo "::error file=$f::no \"## Version gate\" block found (expected one starting at that heading and ending at a bare \"Carry on.\" line)"
              fail=1
              continue
            fi
            sum="$(printf '%s' "$block" | md5sum | cut -d' ' -f1)"
            if [ -z "$first" ]; then
              first="$sum"
              first_file="$f"
              continue
            fi
            if [ "$sum" != "$first" ]; then
              echo "::error file=$f::Version gate block differs from $first_file, keep it byte-identical across every skill"
              fail=1
            fi
          done
          echo "Compared the Version gate block across $count skill files."
          [ "$fail" -eq 0 ] || exit 1

  instance-neutral:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: The innovation-platform plugin names no instance
        run: |
          set -euo pipefail
          bash scripts/instance-neutral.sh plugins/innovation-platform

  tool-names:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The check first proves itself on its fixture: it must report exactly
      # the names the fixture plants, and nothing the fixture marks as passing.
      - name: The tool-name check catches what its fixture plants
        run: |
          set -euo pipefail
          bash scripts/test-check-tool-names.sh

      # Against scripts/platform-tools.txt, the pinned copy of the platform's
      # tool names. Refresh that file at each resync with
      # scripts/platform-tools.sh; the script's header says what it checks.
      - name: The innovation-platform plugin names only tools the platform serves, and all of them
        run: |
          set -euo pipefail
          bash scripts/check-tool-names.sh plugins/innovation-platform
